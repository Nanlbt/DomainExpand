name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DomainExpand-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
